name: CLI Tests

on:
  pull_request:
    paths:
      - 'packages/yuxi-cli/**'
      - '.github/workflows/cli.yml'
  push:
    branches: ['**']
    tags: ['v[0-9]*']
    paths:
      - 'packages/yuxi-cli/**'
      - '.github/workflows/cli.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/yuxi-cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run pack:check
