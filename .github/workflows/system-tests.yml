name: Runtime System Tests

on:
  pull_request:
    paths:
      - '.env.template'
      - 'backend/package/yuxi/**'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - 'backend/server/**'
      - 'backend/test/integration/**'
      - 'backend/test/e2e/**'
      - 'backend/test/support/**'
      - 'backend/test/conftest.py'
      - 'backend/test/live_api_cleanup.py'
      - 'web/**'
      - 'packages/yuxi-cli/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - 'scripts/migrate-storage.sh'
      - '.github/workflows/system-tests.yml'
  push:
    tags: ['v[0-9]*']
    branches: [main]
    paths:
      - '.env.template'
      - 'backend/package/yuxi/**'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - 'backend/server/**'
      - 'backend/test/integration/**'
      - 'backend/test/e2e/**'
      - 'backend/test/support/**'
      - 'backend/test/conftest.py'
      - 'backend/test/live_api_cleanup.py'
      - 'web/**'
      - 'packages/yuxi-cli/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - 'scripts/migrate-storage.sh'
      - '.github/workflows/system-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  system-tests:
    name: PostgreSQL, readiness and deterministic Agent path
    runs-on: ubuntu-latest
    # 新 runner 首次构建 sandbox-provisioner 会下载 Debian 与 Python 依赖，启动预算需覆盖冷缓存构建。
    timeout-minutes: 60
    env:
      JWT_SECRET_KEY: ci-jwt-secret-at-least-thirty-two-characters
      API_KEY_DERIVATION_SECRET: ci-api-key-derivation-secret-at-least-32-chars
      SANDBOX_PROVISIONER_TOKEN: ci-sandbox-token-at-least-thirty-two-characters
      E2E_USERNAME: ci_e2e_admin
      E2E_PASSWORD: ci-e2e-password-at-least-eight
    steps:
      - uses: actions/checkout@v7
      - name: Prepare Compose environment
        run: |
          cp .env.template .env
          sed -i "s/^JWT_SECRET_KEY=.*/JWT_SECRET_KEY=${JWT_SECRET_KEY}/" .env
          sed -i "s/^API_KEY_DERIVATION_SECRET=.*/API_KEY_DERIVATION_SECRET=${API_KEY_DERIVATION_SECRET}/" .env
          sed -i "s/^SANDBOX_PROVISIONER_TOKEN=.*/SANDBOX_PROVISIONER_TOKEN=${SANDBOX_PROVISIONER_TOKEN}/" .env
          cat >> .env <<'EOF'
          LANGFUSE_PUBLIC_KEY=ci-langfuse-public-key
          LANGFUSE_SECRET_KEY=ci-langfuse-secret-key
          LANGFUSE_BASE_URL=http://sandbox-provisioner:8766
          EOF
          grep -E "^(JWT_SECRET_KEY|API_KEY_DERIVATION_SECRET|SANDBOX_PROVISIONER_TOKEN|LANGFUSE_PUBLIC_KEY|LANGFUSE_SECRET_KEY|LANGFUSE_BASE_URL)=.+" .env
      - name: Pull Sandbox runtime image before timed Agent tests
        run: >-
          docker pull "$(docker compose config --format json | python3 -c 'import json, sys; print(json.load(sys.stdin)["services"]["sandbox-provisioner"]["environment"]["SANDBOX_IMAGE"])')"
      - name: Start focused runtime topology
        run: docker compose up -d --build postgres redis minio sandbox-provisioner api worker
      - name: Wait for truthful readiness
        run: |
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:5050/api/system/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs api worker sandbox-provisioner --tail 200
          exit 1
      - name: Initialize isolated E2E administrator
        run: |
          curl -fsS -X POST http://localhost:5050/api/auth/initialize \
            -H 'Content-Type: application/json' \
            --data "{\"uid\":\"${E2E_USERNAME}\",\"password\":\"${E2E_PASSWORD}\"}" >/dev/null
      - name: Start deterministic OpenAI-compatible replay
        run: |
          docker compose cp backend/test/support/openai_replay_server.py sandbox-provisioner:/tmp/yuxi-openai-replay.py
          docker compose exec -d sandbox-provisioner python /tmp/yuxi-openai-replay.py --port 8766
          for attempt in $(seq 1 20); do
            if docker compose exec -T api curl -fsS http://sandbox-provisioner:8766/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Verify worker shipping health
        run: docker compose exec -T worker uv run --no-sync --no-dev arq --check server.worker_main.WorkerSettings
      - name: Verify local job filtering preserves ARQ dispatch and retry
        run: docker compose exec -T api uv run --no-sync --no-dev pytest test/integration/services/test_arq_worker_dispatch.py -q
      - name: Verify worker can write personal Skill UserWorkspace
        run: |
          docker compose exec -T -e E2E_USERNAME worker uv run --no-sync --no-dev python - <<'PY'
          import os
          from pathlib import Path

          skill_root = Path("/app/user-data/shared") / os.environ["E2E_USERNAME"] / "workspace/agents/skills"
          skill_root.mkdir(parents=True, exist_ok=True)
          probe = skill_root / ".worker-write-probe"
          try:
              probe.write_text("worker-write-ok", encoding="utf-8")
              assert probe.read_text(encoding="utf-8") == "worker-write-ok"
          finally:
              probe.unlink(missing_ok=True)
          PY
      - name: Verify worker health leases are expiring runtime facts
        run: |
          worker_ttl=$(docker compose exec -T redis redis-cli PTTL yuxi:worker:health:agent-run-v1)
          reconciliation_ttl=$(docker compose exec -T redis redis-cli PTTL yuxi:worker:health:agent-run-v1:lease-reconciliation)
          test "$worker_ttl" -gt 0 && test "$worker_ttl" -le 6000
          test "$reconciliation_ttl" -gt 0 && test "$reconciliation_ttl" -le 65000
      - name: Verify dead worker removes API readiness
        run: |
          docker compose pause worker
          cleanup() { docker compose unpause worker >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          not_ready=false
          for attempt in $(seq 1 15); do
            status=$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:5050/api/system/ready)
            if [ "$status" = "503" ]; then
              not_ready=true
              break
            fi
            sleep 1
          done
          test "$not_ready" = true
          cleanup
          trap - EXIT
          for attempt in $(seq 1 15); do
            if curl -fsS http://localhost:5050/api/system/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Verify readiness API
        run: docker compose exec -T api uv run --no-sync --no-dev pytest test/integration/api/test_system_router_api.py::test_health_endpoint_is_public test/integration/api/test_system_router_api.py::test_readiness_endpoint_proves_core_runtime_dependencies test/integration/api/test_system_router_api.py::test_discovery_and_openapi_declare_full_knowledge_capabilities -q
      - name: Verify versioned Schema migration contract
        run: docker compose exec -T api uv run --no-sync --no-dev pytest test/integration/services/test_schema_migration_version.py -q
      - name: Verify retired PI history and migration boundaries
        run: docker compose exec -T api uv run --no-sync --no-dev pytest test/integration/services/test_pi_retirement.py -q
      - name: Verify OA profile through real authentication HTTP
        run: docker compose exec -T api uv run --no-sync --no-dev pytest test/integration/api/test_oidc_replica_flow.py -k test_oa_profile -q
      - name: Verify knowledge statistics projection
        run: docker compose exec -T api uv run --no-sync --no-dev pytest test/integration/services/test_knowledge_stats_refresh.py -q
      - name: Verify queue transaction and recovery
        run: docker compose exec -T api uv run --no-sync --no-dev pytest test/integration/services/test_agent_request_queue_concurrency.py -q
      - name: Verify AgentRun lease ownership
        run: docker compose exec -T api uv run --no-sync --no-dev pytest test/integration/services/test_agent_run_lease.py -q
      - name: Verify Run result causality
        run: docker compose exec -T -e TEST_USERNAME="$E2E_USERNAME" -e TEST_PASSWORD="$E2E_PASSWORD" api uv run --no-sync --no-dev pytest test/integration/api/test_agent_run_result_causality.py -q
      - name: Verify Message audit HTTP contract
        timeout-minutes: 3
        run: docker compose exec -T -e TEST_USERNAME="$E2E_USERNAME" -e TEST_PASSWORD="$E2E_PASSWORD" api uv run --no-sync --no-dev pytest test/integration/api/test_chat_router.py::test_thread_message_audits_return_persisted_facts_without_leaking_into_history -q --setup-show -o faulthandler_timeout=60
      - name: Verify deterministic Agent assembled path
        run: docker compose exec -T -e E2E_USERNAME -e E2E_PASSWORD api uv run --no-sync --no-dev pytest test/e2e/test_deterministic_agent_path_e2e.py -q
      - name: Verify answer citation evidence across child Runs and history
        run: |
          docker compose up -d milvus
          for attempt in $(seq 1 60); do
            if docker compose exec -T milvus curl -fsS http://localhost:9091/healthz >/dev/null; then
              break
            fi
            if [ "$attempt" = 60 ]; then
              docker compose logs etcd minio milvus --tail 200
              exit 1
            fi
            sleep 2
          done
          docker compose exec -T -e E2E_USERNAME -e E2E_PASSWORD api uv run --no-sync --no-dev pytest test/e2e/test_answer_citations_e2e.py -q
      - name: Verify identity transaction and replayable secret publication
        run: docker compose exec -T -e TEST_USERNAME="$E2E_USERNAME" -e TEST_PASSWORD="$E2E_PASSWORD" api uv run --no-sync --no-dev pytest test/integration/services/test_identity_admin_service.py test/integration/services/test_api_key_schema_migration.py test/integration/services/test_api_key_user_lifecycle.py test/integration/api/test_apikey_router.py -q
      - name: Verify destructive storage migration and Skill authorization
        run: |
          docker compose exec -T -e TEST_USERNAME="$E2E_USERNAME" -e TEST_PASSWORD="$E2E_PASSWORD" api uv run --no-sync --no-dev pytest \
            test/integration/services/test_workdir_user_workspace.py \
            test/integration/services/test_user_skill_projection.py \
            test/integration/api/test_skill_artifact_authorization.py -q
      - name: Verify viewer filesystem security through HTTP
        run: docker compose exec -T -e TEST_USERNAME="$E2E_USERNAME" -e TEST_PASSWORD="$E2E_PASSWORD" api uv run --no-sync --no-dev pytest test/integration/api/test_viewer_filesystem_security.py -q
      - name: Verify real Sandbox storage isolation and shared projections
        run: docker compose exec -T api uv run --no-sync --no-dev pytest test/integration/services/test_project_workdir_provisioner.py -q
      - name: Verify Durable Task worker path
        run: |
          docker compose stop api worker
          docker compose run --rm storage-migrator
      - name: Verify Durable Task repository
        run: |
          docker compose run --rm --no-deps --entrypoint uv api \
            run --no-sync --no-dev pytest test/integration/services/test_durable_task_repository.py -q
      - name: Prepare failed Durable Task publication
        run: |
          docker compose run --rm --no-deps --entrypoint uv \
            -e DURABLE_TASK_GATE_ID=${{ github.run_id }} api \
            run --no-sync --no-dev pytest \
              test/integration/services/test_durable_task_worker_path.py::test_prepare_task_with_failed_initial_arq_publication -q
      - name: Restart Durable Task shipping services
        run: |
          docker compose up -d --force-recreate milvus api worker
          for attempt in $(seq 1 60); do
            if docker compose exec -T milvus curl -fsS http://localhost:9091/healthz >/dev/null; then
              break
            fi
            if [ "$attempt" = 60 ]; then
              docker compose logs etcd minio milvus --tail 200
              exit 1
            fi
            sleep 2
          done
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:5050/api/system/ready >/dev/null; then
              break
            fi
            if [ "$attempt" = 60 ]; then
              docker compose logs api worker --tail 200
              exit 1
            fi
            sleep 2
          done
      - name: Verify Durable Task recovery
        run: |
          docker compose exec -T -e DURABLE_TASK_GATE_ID=${{ github.run_id }} api \
            uv run --no-sync --no-dev pytest \
              test/integration/services/test_durable_task_worker_path.py::test_shipping_worker_startup_recovers_pending_publication -q
      - name: Verify Durable Task failure hook
        run: |
          docker compose exec -T -e DURABLE_TASK_GATE_ID=${{ github.run_id }} api \
            uv run --no-sync --no-dev pytest \
              test/integration/services/test_durable_task_worker_path.py::test_shipping_worker_failure_runs_domain_hook -q
      - name: Verify Durable Task enqueue HTTP
        run: |
          docker compose exec -T \
            -e TEST_USERNAME=${E2E_USERNAME} \
            -e TEST_PASSWORD=${E2E_PASSWORD} api \
            uv run --no-sync --no-dev pytest \
              test/integration/api/test_task_router.py::test_enqueue_document_creates_task -q
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.6'
          cache-dependency-glob: |
            packages/yuxi-cli/pyproject.toml
            packages/yuxi-cli/uv.lock
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          pnpm --dir web install --frozen-lockfile
          uv sync --project packages/yuxi-cli --frozen --group test
          command -v google-chrome
      - name: Resolve built runtime images
        run: |
          echo "API_IMAGE=$(docker compose images -q api)" >> "$GITHUB_ENV"
          echo "PROVISIONER_IMAGE=$(docker compose images -q sandbox-provisioner)" >> "$GITHUB_ENV"
      - name: Verify knowledge deletion across actual stores
        run: bash backend/test/e2e/knowledge/run_delete.sh "$API_IMAGE" "$PROVISIONER_IMAGE"
      - name: Verify partial indexing through actual worker and stores
        run: bash backend/test/e2e/knowledge/run_index.sh "$API_IMAGE" "$PROVISIONER_IMAGE"
      - name: Verify worker startup recovers lost pending publication
        run: bash backend/test/e2e/runs/run_execution_retry.sh "$API_IMAGE" "$PROVISIONER_IMAGE"
      - name: Verify bounded recovery scanning under locked threads
        run: bash backend/test/e2e/runs/run_recovery_scan.sh "$API_IMAGE"
      - name: Verify Web and CLI recovery in real Chrome
        env:
          CHROME_BIN: google-chrome
          CLIENT_EVIDENCE_DIR: ${{ github.workspace }}/tmp/client-recovery-ci
        run: |
          bash backend/test/e2e/clients/run_recovery.sh "$API_IMAGE" "$PROVISIONER_IMAGE"
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: client-recovery-evidence
          path: tmp/client-recovery-ci
      - name: Runtime logs on failure
        if: failure() || cancelled()
        run: docker compose logs --timestamps api worker sandbox-provisioner
      - name: Stop runtime topology
        if: always()
        run: docker compose down -v
