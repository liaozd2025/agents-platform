server {
    listen 80;
    server_name localhost;

    # 后端限制文件为 100 MiB，额外预留 multipart 请求封装空间。
    client_max_body_size 101M;

    # 入口页必须每次获取最新版本，避免缓存旧入口继续引用已删除的 hash 资源。
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Content-Security-Policy "frame-ancestors 'self' ${YUXI_EMBED_ALLOWED_ORIGINS}" always;
    }

    # hash 资源可长期缓存；缺失时直接返回 404，不能回退到 index.html 伪装成 JS。
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        add_header Content-Security-Policy "frame-ancestors 'self' ${YUXI_EMBED_ALLOWED_ORIGINS}" always;
    }

    location ^~ /.well-known/oauth- {
        proxy_pass http://api:5050;
        proxy_set_header Host $http_host;
    }

    location /api/ {
        proxy_pass http://api:5050/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_http_version 1.1;

        # SSE/流式响应支持
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 增加超时时间（上传和流式响应）
        proxy_read_timeout 600;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
    }

    # 聊天运行端点：请求体是内联 base64 图片（10 张 5MB 图 base64 后约 67MB），
    # 单独放宽到 100M；其余 /api/ 仍受上面的 20M 限制。
    # 这里刻意重复整段代理设置而不嵌套进 /api/：嵌套 location 不继承父级的 proxy_pass，
    # 缺了它会退化成静态文件服务返回 404（`nginx -t` 查不出来），而其余 proxy_* 是否
    # 继承要逐条推敲——这个端点承载 SSE 流式响应，缓冲设置错了会让回复变成憋一大坨再吐。
    # 显式写全，读配置就能确信，不依赖继承规则。
    # 注意：生产拓扑前面还有宿主机 nginx，它也要放行同等大小，否则请求到不了这里。
    location = /api/agent/runs {
        client_max_body_size 100M;
        proxy_pass http://api:5050/api/agent/runs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_http_version 1.1;

        # SSE/流式响应支持
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_read_timeout 600;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
    }

    location /minio/public/ {
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass http://minio:9000/public/;
        proxy_set_header Host minio:9000;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
    }

    location /minio/ {
        return 404;
    }
}
